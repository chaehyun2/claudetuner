<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Tuner</title>
  <script src="theme-init.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg-body: #f5f5f4; --bg-card: #ffffff; --border: #e5e7eb; --text-primary: #1e1b4b; --text-secondary: #6b7280; --accent: #7c3aed; --accent-hover: #6d28d9; --ok: #16a34a; }
    [data-theme="dark"] { --bg-body: #0f1419; --bg-card: #1a1f2e; --border: #2d3748; --text-primary: #F0F0F0; --text-secondary: #A0AEC0; --accent: #8b5cf6; --accent-hover: #7c3aed; --ok: #4ade80; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg-body); color: var(--text-primary); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    html[lang="ko"] body { word-break: keep-all; overflow-wrap: break-word; }
    .card { width: 100%; max-width: 420px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 28px 24px; text-align: center; }
    .icon { width: 40px; height: 40px; margin-bottom: 12px; }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
    .btn { margin-top: 20px; width: 100%; padding: 12px 0; border: none; border-radius: 10px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: .6; cursor: default; }
    .status { margin-top: 14px; font-size: 13px; min-height: 1.2em; color: var(--text-secondary); }
    .status.ok { color: var(--ok); font-weight: 600; }
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="icons/icon128.png" alt="">
    <h1 id="grant-title"></h1>
    <p id="grant-desc"></p>
    <button id="grant-btn" class="btn" type="button"></button>
    <div id="grant-status" class="status" role="status"></div>
  </main>
  <script src="i18n.js"></script>
  <script type="module" src="grant.js"></script>
</body>
</html>
