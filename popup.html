<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h1><a href="https://claudetuner.com" target="_blank" style="color:inherit;text-decoration:none">ClaudeTuner</a></h1>
    <div class="header-actions">
      <button id="collect-btn" class="hdr-btn hdr-btn-primary" data-i18n="btn_collect"></button>
      <a href="https://claudetuner.com/dashboard" data-dash-link target="_blank" class="hdr-btn hdr-btn-link" data-i18n-title="btn_detail" title="Analytics"><svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor" style="flex:none"><path d="M3 3a1 1 0 011 1v12h12a1 1 0 110 2H3a1 1 0 01-1-1V4a1 1 0 011-1zm14 3a1 1 0 011 1v2a1 1 0 11-2 0V9.414l-3.293 3.293a1 1 0 01-1.414 0L9 10.414l-2.293 2.293a1 1 0 01-1.414-1.414l3-3a1 1 0 011.414 0L12 10.586 14.586 8H13a1 1 0 110-2h4z"/></svg></a>
      <button id="notice-toggle-btn" class="hdr-btn-icon" title="Announcements" style="display:none;position:relative">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="currentColor"><path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-2.83-2h5.66A3 3 0 0110 18z"/></svg>
        <span id="notice-badge" style="display:none;position:absolute;top:-2px;right:-2px;background:#ef4444;color:white;font-size:8px;font-weight:700;min-width:13px;height:13px;border-radius:50%;align-items:center;justify-content:center;line-height:1">0</span>
      </button>
      <a href="https://tally.so/r/q4dyQk" target="_blank" class="hdr-btn-icon" title="Feedback">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zm-4 0H9v2h2V9z" clip-rule="evenodd"/></svg>
      </a>
      <button id="open-tab-btn" class="hdr-btn-icon" title="Open as side panel">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 011 1v12a1 1 0 01-1 1H4a1 1 0 01-1-1V4zm1 0v12h4V4H4zm6 0v12h6V4h-6z" clip-rule="evenodd"/></svg>
      </button>
      <button id="theme-toggle-btn" class="hdr-btn-icon" title="Theme">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="currentColor"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
      </button>
      <button id="options-btn" class="hdr-btn-icon" title="Settings">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>
      </button>
    </div>
  </div>

  <div id="pin-hint" style="display:none;background:var(--accent-light);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:11px;color:var(--accent);text-align:center;position:relative">
    <button id="pin-hint-close" style="position:absolute;top:4px;right:8px;background:none;border:none;color:#a78bfa;cursor:pointer;font-size:13px;padding:0">×</button>
    <!-- Before/After: 툴바 모양으로 표현 -->
    <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px">
      <!-- Before: 툴바에 아이콘 없음 -->
      <div style="text-align:center">
        <div style="display:inline-flex;align-items:center;gap:6px;background:var(--bg-hover);border:1px solid var(--border);border-radius:8px;padding:4px 10px;min-width:70px;justify-content:center">
          <span style="font-size:11px;color:var(--text-muted)">⋯</span>
          <div style="width:24px;height:24px;border:1.5px dashed var(--border);border-radius:4px"></div>
          <span style="font-size:11px;color:var(--text-muted)">⋮</span>
        </div>
        <div style="font-size:8px;color:#9ca3af;margin-top:2px" id="pin-hint-before"></div>
      </div>
      <!-- Arrow -->
      <svg width="20" height="14" viewBox="0 0 20 14">
        <path d="M2 7h12M11 3l4 4-4 4" stroke="#7c3aed" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <!-- After: 툴바에 아이콘 + 배지 표시 -->
      <div style="text-align:center">
        <div style="display:inline-flex;align-items:center;gap:6px;background:var(--bg-hover);border:1px solid var(--border);border-radius:8px;padding:4px 10px;min-width:70px;justify-content:center">
          <span style="font-size:11px;color:#9ca3af">⋯</span>
          <div style="position:relative;width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:var(--accent-light);border-radius:4px;border:1.5px solid var(--accent)">
            <img src="icons/icon16.png" width="14" height="14">
            <span id="pin-hint-badge" style="position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:#7c3aed;color:white;font-size:7px;font-weight:700;padding:0 3px;border-radius:3px;line-height:1.3;white-space:nowrap">69%</span>
          </div>
          <span style="font-size:11px;color:#9ca3af">⋮</span>
        </div>
        <div style="font-size:8px;color:var(--accent);font-weight:600;margin-top:2px" id="pin-hint-after"></div>
      </div>
    </div>
    <span id="pin-hint-text" style="font-size:11px"></span>
  </div>

  <div id="review-nudge" style="display:none;background:var(--accent-light);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px;align-items:center;gap:8px;font-size:11px">
    <span style="font-size:15px">⭐</span>
    <span id="review-nudge-text" style="flex:1;color:var(--text-primary)"></span>
    <a id="review-nudge-link" href="https://chromewebstore.google.com/detail/claude-tuner/ajnnckikagphjbgpicpoffockabnhond/reviews" target="_blank" style="background:#4f46e5;color:white;padding:3px 10px;border-radius:5px;text-decoration:none;font-weight:600;font-size:10px;white-space:nowrap"></a>
    <button id="review-nudge-close" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:14px;padding:0 2px">×</button>
  </div>

  <!-- Promo (ad) banners: always visible, independent of the bell toggle below -->
  <div id="ct-popup-promos"></div>
  <div id="ct-popup-notices" style="display:none"></div>
  <div id="perm-banner" class="perm-banner hidden"></div>
  <!-- Why a provider stopped collecting (#852). Its own block, NOT a row inside the org selector:
       that selector only renders when `collectedOrgs` is non-empty and iterates real orgs, so a
       provider that is failing to collect has no row there — exactly the user who needs this
       (Codex review of the plan). Reuses .perm-banner styling: same "action needed" weight, and
       its dark-theme rules already exist. -->
  <div id="prov-err-banner" class="perm-banner hidden"></div>
  <!-- Orgs the server is dropping at the 3-org cap. Reuses .perm-banner: same "action needed"
       styling, and its dark-theme rules already exist. -->
  <div id="capdrop-banner" class="perm-banner hidden"></div>

  <!-- Login CTA (Phase 2 단계 4): shown to a fresh, not-logged-in install (showLoginPrompt).
       Additive — usage still works locally; login unlocks server-backed features. New users
       have no known email, so this collects one (pre-filled from the detected provider email). -->
  <div id="login-cta" class="warn-banner hidden">
    <!-- Collapsed mini reminder — persistent (never fully dismissed): "로컬만 사용" collapses to
         this compact login bar (like the permission card) so the nudge stays but small. -->
    <div id="login-cta-mini" style="display:none;align-items:center;gap:8px">
      <span id="login-cta-mini-msg" class="cta-strong" style="flex:1;font-size:11px;line-height:1.4"></span>
      <button id="login-cta-mini-login" class="btn-primary" style="padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;border:none;cursor:pointer;white-space:nowrap"></button>
    </div>
    <!-- Expanded full CTA: benefits (✓) → down arrow → verify action.
         position:relative anchors the × below; the title reserves room for it on the right. -->
    <div id="login-cta-full" style="position:relative">
      <!-- Same action as #login-cta-dismiss (bound together in renderLoginCta): the text button
           names the consequence, this names the gesture people already look for in a card corner. -->
      <button id="login-cta-close" type="button"
        style="position:absolute;top:-2px;right:-2px;background:none;border:0;color:var(--text-muted);font-size:16px;line-height:1;cursor:pointer;padding:2px 5px">&times;</button>
      <div id="login-cta-title" class="cta-strong" style="font-size:13px;font-weight:700;line-height:1.35;margin-bottom:3px;padding-right:20px"></div>
      <div id="login-cta-msg" class="cta-sub" style="font-size:11.5px;line-height:1.45;margin-bottom:10px"></div>
      <div id="login-cta-feats" style="display:flex;flex-direction:column;gap:7px;margin-bottom:10px"></div>
      <!-- Which provider account this install will hand over. Disclosure, not a gate: the popup
           login is itself the user's explicit action, so it does not ask again — but on a shared
           machine the account being absorbed may not be theirs, and until now nothing said so. -->
      <div id="login-cta-attrib" class="cta-sub" style="display:none;font-size:11px;line-height:1.45;margin-bottom:10px;padding:7px 9px;border-radius:6px;background:var(--bg-subtle,#f6f5f4);color:var(--text-secondary);overflow-wrap:anywhere"></div>
      <div class="cta-arrow" style="text-align:center;line-height:1;margin:0 0 8px"><span style="font-size:15px">↓</span></div>
      <div id="login-cta-prompt" class="cta-sub" style="font-size:11px;font-weight:600;text-align:center;margin-bottom:7px"></div>
      <!-- One-click path. The email+code flow below still works and stays the fallback:
           Google sign-in needs an optional `identity` permission the user may decline.
           The markup lives in ONE <template id="google-btn-tpl"> (bottom of this file) because the
           re-auth widget mounts the same button — a second copy of the brand SVG would drift. -->
      <div id="login-cta-google-slot"></div>
      <div id="login-cta-or" class="cta-sub" style="text-align:center;font-size:10.5px;margin-bottom:7px;opacity:.8"></div>
      <div id="login-cta-step-email">
        <input id="login-cta-email" type="email" autocomplete="email" inputmode="email"
          style="width:100%;box-sizing:border-box;padding:9px 10px;margin-bottom:6px;border:1px solid var(--border);border-radius:8px;font-size:13px;text-align:center" />
        <button id="login-cta-send" class="btn-primary" style="width:100%;padding:9px;border-radius:8px;font-size:12.5px;font-weight:700;border:none;cursor:pointer"></button>
        <button id="login-cta-dismiss" style="width:100%;padding:7px;margin-top:5px;background:none;border:none;color:var(--text-muted);font-size:11px;cursor:pointer"></button>
      </div>
      <div id="login-cta-step-verify" class="hidden">
        <input id="login-cta-code" type="text" inputmode="numeric" autocomplete="one-time-code"
          style="width:100%;box-sizing:border-box;padding:9px;margin-bottom:6px;border:1px solid var(--border);border-radius:8px;font-size:15px;letter-spacing:4px;text-align:center" />
        <button id="login-cta-verify" class="btn-primary" style="width:100%;padding:9px;border-radius:8px;font-size:12.5px;font-weight:700;border:none;cursor:pointer"></button>
        <!-- The rejection copy says "request a new one"; this is that control. It has to live on the
             verify step, because the send button is in the (now hidden) email step. -->
        <button id="login-cta-resend" type="button" style="width:100%;padding:7px;margin-top:5px;background:none;border:none;color:var(--text-muted);font-size:11px;cursor:pointer"></button>
      </div>
      <div id="login-cta-status" class="warn-hint" style="margin-top:7px;text-align:center"></div>
    </div>
  </div>


  <div class="status-row">
    <div id="status-indicator" class="status-dot gray"></div>
    <div id="status-text" class="status-text" data-i18n="no_data"></div>
    <div class="runner-track" id="runner-track" style="display:none">
      <div class="runner-char" id="runner-char">🏃</div>
    </div>
    <button class="runner-pause" id="runner-pause" style="display:none" title="⏸">⏸</button>
  </div>

  <!-- Overview ("모아 보기") master screen — one card per collected org/provider.
       Shown only for multi-org/multi-provider users; populated by ui/overview.js. -->
  <div id="overview-section" class="overview-section hidden"></div>

  <!-- Top tab switcher between Overview ("모아 보기") and detail ("자세히").
       Always visible for multi-org/multi-provider users (shown via popup.js). -->
  <div id="view-tabs" class="view-tabs hidden">
    <button id="tab-overview" class="view-tab" data-i18n="ov_title"></button>
    <button id="tab-detail" class="view-tab" data-i18n="ov_detail"></button>
  </div>

  <!-- 조직 선택 (복수 조직 시) -->
  <div id="org-selector" class="org-selector hidden"></div>

  <!-- 에러 배너 -->
  <div id="error-banner" class="error-banner hidden">
    <button id="error-dismiss" class="error-dismiss" style="display:none" aria-label="dismiss">&times;</button>
    <div class="error-title" data-i18n="error_banner_title"></div>
    <div class="error-msg" id="error-msg"></div>
    <div class="error-hint">
      <a href="https://claude.ai" target="_blank" data-i18n="open_claude"></a> <span data-i18n="error_banner_hint"></span>
    </div>
    <div class="error-timing" id="error-timing"></div>
  </div>

  <!-- Extension-too-old block (server 426 upgrade_required, MIN_INGEST_VERSION gate).
       NOT dismissable, and deliberately NOT the login CTA: the user may be perfectly logged in,
       and sending them to a login screen for a version problem points them at what is not broken.
       The only action is "update the extension", so the banner links to the store page. -->
  <div id="upgrade-warn" class="warn-banner hidden">
    <div class="warn-title" id="upgrade-warn-title"></div>
    <div class="warn-msg" id="upgrade-warn-msg"></div>
    <div class="warn-hint">
      <a href="https://chromewebstore.google.com/detail/claude-tuner/ajnnckikagphjbgpicpoffockabnhond" target="_blank" rel="noopener" id="upgrade-warn-link"></a> <span id="upgrade-warn-hint"></span>
    </div>
  </div>

  <!-- Claude account email mismatch warning (claude.ai login ≠ Tuner login → 403 silent drop) -->
  <!-- ★ auto-move notice (#966). Informational: collection is healthy, the primary org just
       moved because the old one went silent. The UNDO lives on the dashboard, not here —
       /api/me/* is session/Google-only and rejects ext_token, so the popup can explain but
       cannot write. -->
  <div id="pin-move-warn" class="warn-banner hidden">
    <button id="pin-move-dismiss" class="error-dismiss" aria-label="dismiss">&times;</button>
    <div class="warn-title" id="pin-move-title"></div>
    <div class="warn-msg" id="pin-move-msg"></div>
    <div class="warn-hint">
      <a href="https://claudetuner.com/dashboard/" target="_blank" rel="noopener" id="pin-move-link"></a> <span id="pin-move-hint"></span>
    </div>
  </div>

  <div id="claude-email-warn" class="warn-banner hidden">
    <button id="email-warn-dismiss" class="error-dismiss" aria-label="dismiss">&times;</button>
    <div class="warn-title" id="email-warn-title"></div>
    <div class="warn-msg" id="email-warn-msg"></div>
    <div class="warn-hint">
      <a href="https://claude.ai" target="_blank" id="email-warn-link"></a> <span id="email-warn-hint"></span>
    </div>
    <!-- Cross-email link (step C): link this claude.ai account to the Tuner account
         via an emailed code, then the client substitutes user_email so ingest is
         accepted. See docs/DESIGN-identity-email-auth-trap.md. -->
    <div id="email-link-block" class="hidden" style="margin-top:8px">
      <div id="email-link-step-request">
        <button id="email-link-send" class="btn-primary" style="width:100%;padding:8px;border-radius:6px;font-size:12px;font-weight:600;border:none;cursor:pointer"></button>
      </div>
      <div id="email-link-step-verify" class="hidden">
        <input id="email-link-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6"
          style="width:100%;box-sizing:border-box;padding:8px;margin-bottom:6px;border:1px solid var(--border);border-radius:6px;font-size:14px;letter-spacing:3px;text-align:center" />
        <button id="email-link-verify" class="btn-primary" style="width:100%;padding:8px;border-radius:6px;font-size:12px;font-weight:600;border:none;cursor:pointer"></button>
      </div>
      <div id="email-link-status" class="warn-hint" role="status" aria-live="polite" style="margin-top:6px"></div>
    </div>
  </div>

  <!-- Cross-email link "linked" state (step C): shown when a verified link exists
       (claudeAliasLink in storage). Lets the user unlink self-service. -->
  <!-- display toggled directly via style.display in render.js — an inline display
       would override the .hidden class (no !important), so we don't use .hidden here. -->
  <div id="claude-link-linked" style="display:none;align-items:center;gap:8px;padding:8px 10px;margin:8px 0;border:1px solid var(--border);border-radius:8px;font-size:12px">
    <span id="claude-link-linked-text" role="status" aria-live="polite" style="flex:1;color:var(--text-secondary)"></span>
    <button id="claude-link-unlink" style="padding:5px 10px;border-radius:6px;font-size:11px;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--text-secondary);cursor:pointer"></button>
  </div>

  <!-- Re-auth widget: an email (independent) account whose ext_token expired can't
       use the shared-API_KEY fallback (server blocks it for email accounts), so
       collection stalls with no self-recovery. Let them re-authenticate via the
       magic-code flow to mint a fresh ext_token. Once collection resumes over the
       new Bearer token, the server auto-upgrades the account email→claude
       (/api/auth/link-claude) so this can't recur. -->
  <div id="reauth-widget" class="warn-banner hidden">
    <div class="warn-title" id="reauth-title"></div>
    <div class="warn-msg" id="reauth-msg"></div>
    <!-- Same one-click path the login CTA offers, mounted from the shared template. These users
         already had an account, so the fastest way back in is the one that needs no inbox round
         trip. The email code below stays the fallback: `identity` is optional and may be declined. -->
    <div id="reauth-google-slot"></div>
    <div id="reauth-or" class="warn-hint" style="text-align:center;font-size:10.5px;margin-bottom:7px;opacity:.8"></div>
    <div id="reauth-step-request">
      <button id="reauth-send" class="btn-primary" style="width:100%;padding:8px;border-radius:6px;font-size:12px;font-weight:600;border:none;cursor:pointer"></button>
    </div>
    <div id="reauth-step-verify" class="hidden">
      <input id="reauth-code" type="text" inputmode="numeric" autocomplete="one-time-code"
        style="width:100%;box-sizing:border-box;padding:8px;margin-bottom:6px;border:1px solid var(--border);border-radius:6px;font-size:14px;letter-spacing:3px;text-align:center" />
      <button id="reauth-verify" class="btn-primary" style="width:100%;padding:8px;border-radius:6px;font-size:12px;font-weight:600;border:none;cursor:pointer"></button>
      <button id="reauth-resend" type="button" style="width:100%;padding:7px;margin-top:5px;background:none;border:none;color:var(--text-muted);font-size:11px;cursor:pointer"></button>
    </div>
    <div id="reauth-status" class="warn-hint" style="margin-top:6px"></div>
  </div>

  <!-- 온보딩 가이드 -->
  <div id="onboarding" class="onboarding hidden">
    <div class="ob-hero">
      <div class="ob-icon">✨</div>
      <h2 id="ob-title" data-i18n="ob_title"></h2>
      <p data-i18n="ob_desc"></p>
    </div>
    <div class="ob-steps">
      <div class="ob-step">
        <div class="ob-num">1</div>
        <div class="ob-content">
          <strong data-i18n-html="ob_step1_title_html"></strong>
          <span data-i18n="ob_step1_desc"></span>
        </div>
      </div>
      <div class="ob-step">
        <div class="ob-num">2</div>
        <div class="ob-content">
          <strong data-i18n="ob_step2_title"></strong>
          <span data-i18n="ob_step2_desc"></span>
        </div>
      </div>
      <div class="ob-step">
        <div class="ob-num">3</div>
        <div class="ob-content">
          <strong data-i18n-html="ob_step3_title_html"></strong>
          <span data-i18n="ob_step3_desc"></span>
        </div>
      </div>
    </div>
    <div class="ob-features">
      <p class="ob-feat-title" data-i18n="ob_features_title"></p>
      <div class="ob-feat-list">
        <div class="ob-feat">📊 <span data-i18n="ob_feat_usage"></span></div>
        <div class="ob-feat">📈 <span data-i18n="ob_feat_predict"></span></div>
        <div class="ob-feat">⚡ <span data-i18n="ob_feat_optimize"></span></div>
        <div class="ob-feat">👥 <span data-i18n="ob_feat_team"></span></div>
      </div>
    </div>
    <button class="ob-cta" id="ob-collect-btn" data-i18n="ob_cta"></button>
    <a href="https://claudetuner.com/dashboard" target="_blank" class="ob-cta-secondary" data-i18n="ob_step3_title"></a>
    <div class="ob-link"><a href="https://claudetuner.com/welcome/" target="_blank" data-i18n="ob_guide_link"></a></div>
  </div>

  <!-- #1109 — the way back for an install a cross-label claim moved to another account.

           installs hold one (a login-proven `dash_claim` token);
         · the footer "다른 계정으로 전환" renders only when serverSyncGrandfathered === false,
           and an existing install is stamped `true` on update (background.js) — so a claimed
           install of that vintage has NO entry point at all, which is the whole bug.
       It is also a different ACTION: the footer control removes the token first, which for a
       PROVEN_SRC install means everHadProvenToken keeps the api_key fallback withheld and, with
       API_KEY_INGEST_ENABLED=enforce, nothing re-mints — collection just stops. This one only ever
       ADDS a login (bg/storage.js setExtToken replaces the token in place). Nothing here clears a
       token, and nothing should be added that does.

        <!-- Shown only when the previous account was NOT recorded: names the provider address as
             what it is (a hint), instead of asserting it was the previous Tuner account. -->
        <div id="claim-switch-hint" class="warn-hint" style="font-size:10.5px;line-height:1.4;margin-bottom:6px;text-align:center;overflow-wrap:anywhere"></div>
        <button id="claim-switch-send" class="btn-primary" style="width:100%;padding:9px;border-radius:8px;font-size:12.5px;font-weight:700;border:none;cursor:pointer"></button>
      </div>
      <div id="claim-switch-step-verify" class="hidden">
        <input id="claim-switch-code" type="text" inputmode="numeric" autocomplete="one-time-code"
          style="width:100%;box-sizing:border-box;padding:9px;margin-bottom:6px;border:1px solid var(--border);border-radius:8px;font-size:15px;letter-spacing:4px;text-align:center" />
        <button id="claim-switch-verify" class="btn-primary" style="width:100%;padding:9px;border-radius:8px;font-size:12.5px;font-weight:700;border:none;cursor:pointer"></button>
        <button id="claim-switch-resend" type="button" style="width:100%;padding:7px;margin-top:5px;background:none;border:none;color:var(--text-muted);font-size:11px;cursor:pointer"></button>
      </div>
      <div id="claim-switch-status" class="warn-hint" style="margin-top:7px;text-align:center"></div>
      <button id="claim-switch-close" type="button"
        style="width:100%;padding:7px;margin-top:5px;background:none;border:none;color:var(--text-muted);font-size:11px;cursor:pointer"></button>
    </div>
  </div>

  <!-- Plan change confirmation modal -->
  <div id="smart-rec-confirm-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center">
    <div style="width:320px;max-width:90%;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:0 4px 24px rgba(0,0,0,0.3)">
      <div id="src-modal-title" style="font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:8px"></div>
      <div id="src-modal-plan" style="font-size:14px;font-weight:700;color:var(--text-primary);margin-bottom:4px"></div>
      <div id="src-modal-cost" style="font-size:11px;color:var(--text-secondary);margin-bottom:4px"></div>
      <div id="src-modal-timing" style="font-size:11px;color:var(--text-secondary);margin-bottom:4px"></div>
      <div id="src-modal-warning" style="font-size:11px;color:#d97706;margin-bottom:12px"></div>
      <div style="display:flex;gap:8px">
        <button id="src-modal-confirm" style="flex:1;font-size:11px;padding:6px 12px;border-radius:6px;color:white;border:none;cursor:pointer;font-weight:500"></button>
        <button id="src-modal-cancel" style="flex:1;font-size:11px;padding:6px 12px;border-radius:6px;cursor:pointer;background:var(--bg-hover);border:1px solid var(--border);color:var(--text-secondary);font-weight:500"></button>
      </div>
    </div>
  </div>

  <!-- Shared Google sign-in button — the single source for this markup. mountGoogleButton() (popup.js)
       clones it into #login-cta-google-slot and #reauth-google-slot. Kept as ONE copy on purpose:
       the brand SVG and its styling must not fork between the two login surfaces. Class-based, not
       id-based, precisely because it is instantiated more than once. -->
  <template id="google-btn-tpl">
    <button class="google-btn" style="width:100%;padding:9px;margin-bottom:7px;background:#fff;color:#3c4043;border:1px solid #dadce0;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px">
      <svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.02-3.7H.96v2.34A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.98 10.72a5.4 5.4 0 0 1 0-3.44V4.94H.96a9 9 0 0 0 0 8.12l3.02-2.34z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.94l3.02 2.34C4.68 5.16 6.66 3.58 9 3.58z"/>
      </svg>
      <span class="google-btn-label"></span>
    </button>
  </template>

  <script src="config.js"></script>
  <script src="analytics.js"></script>
  <script src="i18n.js"></script>
  <!-- usage-shared.js is the classic content-script core; loading it here lets the popup ES
       modules reuse the SAME ad-serving logic (globalThis.__ctUsageCore) as the sidebars,
       instead of duplicating it (single-source-of-truth rule). -->
  <script src="usage-shared.js"></script>
  <!-- popup.js is an ES module; config/analytics/i18n stay classic globals (also used by content scripts) and load first. -->
  <script type="module" src="popup.js"></script>
</body>
</html>
